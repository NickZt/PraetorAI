server:
  port: 8080

spring:
  application:
    name: rdss
  
  # Neo4j Configuration
  data:
    neo4j:
      uri: bolt://localhost:7687
      authentication:
        username: ${NEO4J_USERNAME:neo4j}
        password: ${NEO4J_PASSWORD:password}
      database: rdss
  
  # MongoDB Configuration
  mongodb:
    host: localhost
    port: 27017
    database: rdss_documents
  
  # Redis Configuration
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# Weaviate Configuration
weaviate:
  host: localhost
  port: 8080
  scheme: http
  api-key: ""

# LLM Configuration (MNNLLama)
llm:
  base-url: http://localhost:8080/v1
  model: default
  api-key: ${LLM_API_KEY:demo}
  timeout: 60s
  max-retries: 3

# LangChain4j Configuration
langchain4j:
  chat-model:
    provider: ollama
    model-name: llama3.1:8b
    temperature: 0.7
    max-tokens: 2048
  
  embedding-model:
    provider: all-minilm-l6-v2
    dimension: 384

# Document Processing
document:
  storage:
    path: ./documents
    max-size: 100MB
  parsing:
    timeout: 30s
    max-pages: 100

# Agent Configuration
agents:
  curator:
    batch-size: 10
    processing-timeout: 5m
    embedding-batch-size: 50
  
  connector:
    similarity-threshold: 0.8
    max-connections: 20
    path-depth: 3
  
  advisor:
    maturity-decay-factor: 0.1
    recommendation-limit: 10
    confidence-threshold: 0.7

# Logging
logging:
  level:
    com.tactorder.rdss: DEBUG
    org.neo4j.driver: INFO
    org.mongodb.driver: INFO
    io.weaviate: INFO
    dev.langchain4j: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Management Endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
