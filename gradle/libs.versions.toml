[versions]
kotlin = "2.0.0"
vertx = "4.5.8"
neo4j = "5.21.0"
mongodb = "5.1.0"
langchain4j = "0.31.0"
jackson = "2.17.0"
coroutines = "1.8.0"

[libraries]
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }

vertx-core = { module = "io.vertx:vertx-core", version.ref = "vertx" }
vertx-web = { module = "io.vertx:vertx-web", version.ref = "vertx" }
vertx-mongo = { module = "io.vertx:vertx-mongo-client", version.ref = "vertx" }
vertx-config = { module = "io.vertx:vertx-config", version.ref = "vertx" }

neo4j-ogm = { module = "org.neo4j:neo4j-ogm-core", version = "4.0.10" }
neo4j-driver = { module = "org.neo4j.driver:neo4j-java-driver", version.ref = "neo4j" }

mongodb-driver = { module = "org.mongodb:mongodb-driver-reactivestreams", version.ref = "mongodb" }

langchain4j-core = { module = "dev.langchain4j:langchain4j", version.ref = "langchain4j" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version.ref = "langchain4j" }
langchain4j-neo4j = { module = "dev.langchain4j:langchain4j-neo4j-vector", version.ref = "langchain4j" }

jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-plugin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
